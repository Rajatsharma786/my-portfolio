<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rajat Sharma | Gen AI Engineer</title>
<meta name="description" content="Gen AI Engineer building agents, RAG pipelines and document AI on Azure and GCP.">
<style>
:root{--bg:#242424;--card:#2b2b2b;--line:#3a3a3a;--tx:#f5f5f5;--mu:#a3a3a3;--ac:#f7ab0a;--ac2:#f7ab0a}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit;text-decoration:none}
nav{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:14px 5vw;background:rgba(36,36,36,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav b{letter-spacing:.08em}
nav div a{margin-left:22px;color:var(--mu);font-size:14px;transition:color .2s}
nav div a:hover{color:var(--ac2)}
#hero{position:relative;height:100vh;min-height:560px;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden}
.circ{position:absolute;left:50%;top:50%;border:1px solid #3d3d3d;border-radius:50%;transform:translate(-50%,-50%);animation:pu 5s ease-in-out infinite}
.circ.g{border-color:rgba(247,171,10,.45)}
@keyframes pu{50%{transform:translate(-50%,-50%) scale(1.07);opacity:.45}}
.hc{position:relative;z-index:2;padding:0 5vw}
.hc small{color:var(--ac2);letter-spacing:.3em;text-transform:uppercase;font-size:13px}
.hc h1{font-size:clamp(2.4rem,7vw,5rem);line-height:1.1;margin:14px 0}
.hc h1 span{color:var(--ac)}
.role{font-size:clamp(1.1rem,3vw,1.7rem);color:var(--mu);min-height:2.2em}
.cur{display:inline-block;width:2px;height:1em;background:var(--ac2);margin-left:3px;vertical-align:-3px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.btns{margin-top:26px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{padding:11px 24px;border-radius:999px;border:1px solid var(--ac);font-size:14px;transition:transform .2s,background .2s}
.btn:hover{background:var(--ac);color:#242424}
.btn.p{background:var(--ac);color:#242424}
.scroll{position:absolute;bottom:22px;left:50%;width:22px;height:36px;border:2px solid var(--mu);border-radius:12px;z-index:2;transform:translateX(-50%)}
.scroll:after{content:"";position:absolute;left:50%;top:7px;width:4px;height:7px;margin-left:-2px;background:var(--ac2);border-radius:2px;animation:sc 1.6s infinite}
@keyframes sc{60%{transform:translateY(12px);opacity:0}}
section{max-width:1100px;margin:0 auto;padding:96px 5vw}
h2{font-size:clamp(1.6rem,4vw,2.4rem);margin-bottom:34px}
h2:before{content:"";display:inline-block;width:34px;height:3px;background:var(--ac);margin-right:14px;vertical-align:middle}
.rv{opacity:0;transform:translateY(34px);transition:opacity .7s ease,transform .7s ease}
.rv.in{opacity:1;transform:none}
.about{font-size:1.1rem;color:var(--mu);max-width:760px}
.stats{display:flex;gap:30px;flex-wrap:wrap;margin-top:30px}
.stats div b{display:block;font-size:2rem;color:var(--ac2)}
.stats div span{color:var(--mu);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:20px;transition:transform .25s,border-color .25s,box-shadow .25s}
.card:hover{transform:translateY(-3px);border-color:var(--ac);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.card h3{font-size:1.2rem}
.meta{color:var(--ac2);font-size:13px;margin:2px 0 10px}
.card ul{padding-left:18px;color:var(--mu)}
.card li{margin:5px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.grid .card{margin:0}
.num{color:var(--ac);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.chip{font-size:12px;padding:3px 10px;border-radius:999px;background:rgba(247,171,10,.08);border:1px solid rgba(247,171,10,.35);color:var(--ac2);transition:background .2s,color .2s}
.chip:hover{background:var(--ac);color:#242424}
.sk h3{font-size:1rem;color:var(--tx)}
.contact{text-align:center}
.contact p{color:var(--mu);margin-bottom:22px}
footer{text-align:center;color:var(--mu);font-size:13px;padding:30px;border-top:1px solid var(--line)}
@media(max-width:640px){nav div a{margin-left:12px}}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}*{animation:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>
const h = React.createElement;
const { useState, useEffect, useRef } = React;

/* ---------- CONTENT: edit here ---------- */
const ME = {
  name: "Rajat Sharma",
  roles: ["Gen AI Engineer", "Agentic AI Builder", "RAG & Document AI", "LLM Evals & Observability"],
  email: "rajatsharma0101786@outlook.com",
  phone: "0406 443 551",
  github: "https://github.com/Rajatsharma786",
  about: "I’m a Gen AI Engineer based in Melbourne with 3+ years of experience shipping AI products across SaaS, insurance, finance and supply chain. I build multi-agent systems, RAG pipelines and document-extraction workflows on Azure and GCP, and I trace and evaluate them so they stay reliable in production. I build with Claude Code using spec-first delivery."
};
const STATS = [["3+","Years shipping AI"],["150/day","Invoices processed"],["78→94%","Extraction accuracy"],["20+","Customer reports automated"]];
const EXP = [
  { role: "Gen AI Engineer", org: "Aera", when: "Nov 2025 – Present", pts: [
    "Multi-tenant SaaS API on PostgreSQL with Row-Level Security and per-request org_id isolation.",
    "Content pipeline across 3 image models, orchestrated with LangGraph on Redis queues with ARQ workers.",
    "Invoice OCR pipeline on Azure Document Intelligence at 150 invoices/day; accuracy raised from 78% to 94% with preprocessing.",
    "Phoenix tracing, Prometheus metrics, a supervisor-agent loop, and a GitHub Actions CI/CD pipeline for an on-prem deployment behind Caddy.",
    "Copilot Studio sales agent for Teams (cut research time by 50%) and a Python reporting pipeline for 20+ customers with LLM summaries under validation rules."
  ]},
  { role: "Simulation Data Consultant", org: "Simwell", when: "Aug 2023 – Mar 2025", pts: [
    "Supply chain simulation models: network efficiency up 18%, logistics costs down 12%.",
    "Power BI dashboards for 8 businesses, plus a RAG assistant on Streamlit with AWS and Snowflake.",
    "Led a Scrum team of 5."
  ]},
  { role: "Data Science Analyst", org: "WNS", when: "Feb 2022 – Jun 2023", pts: [
    "Claim-propensity models (Random Forest, GLM, XGBoost) in insurance, accuracy up 22%.",
    "Automated daily scoring, retraining and monitoring pipelines in Python and SQL."
  ]}
];
const SKILLS = [
  ["GenAI & Agents", ["LangGraph","LangChain","CrewAI","RAG","Multi-agent","Pydantic","Claude Code","MCP-style tools","Sarvam Saaras v3"]],
  ["Evals & Observability", ["Arize Phoenix","Prometheus","Guardrails","Output evals"]],
  ["Azure & Microsoft", ["Document Intelligence","Blob & Queue","Copilot Studio","Power Automate","Dataverse","PII Detection","Power BI"]],
  ["Cloud & DevOps", ["Azure","GCP","AWS","Docker","GitHub Actions","Caddy","NSSM"]],
  ["Backend & Data", ["Python","FastAPI","ARQ","Redis","PostgreSQL","Azure SQL","ChromaDB","Stripe"]],
  ["ML", ["XGBoost","OCR","NLP","PCA","Feature engineering"]]
];
/* Add or reorder projects here. CallIQ first, Lexi Law second. */
const PROJECTS = [
  { t: "CallIQ", d: "AI call-QA assistant built with a team of 3. Users upload call recordings and receive a per-call or bulk report scoring each call against the customer’s pitch script and their own checkpoints.", pts: [
    "Claude Opus scoring with checkpoints loaded into a Pydantic model for validated output.",
    "Language-routed transcription: Sarvam Saaras v3 with diarization for Hindi and Indian English, GPT-4o-transcribe-diarize for other English.",
    "PII redacted with Azure PII detection before the LLM; sensitive columns masked in Azure SQL."
  ], tech: ["Claude Opus","Pydantic","Sarvam","GPT-4o Transcribe","Azure SQL","Azure PII","Dynamic Data Masking"] },
  { t: "Lexi Law Agent", d: "Multi-agent legal assistant over Victorian legislation that accepts PDF and image uploads alongside text queries.", pts: [
    "RAG with Legal-BERT, ChromaDB and OCR; batching and async cut retrieval time by 45%.",
    "Azure Web Apps via Azure DevOps CI/CD with Redis caching and Phoenix tracing: ~60% faster responses."
  ], tech: ["LangGraph","RAG","ChromaDB","Legal-BERT","Azure","Redis","Arize Phoenix"] },
  { t: "Financial Analyst Agent", d: "ReAct stock-analysis agent using live market data and a RAG layer for financial retrieval.", pts: [
    "LangGraph and GPT-4o-mini with the OpenBB API.",
    "Docker and CI/CD on GCP; a scheduler emails daily stock summaries."
  ], tech: ["LangGraph","OpenAI","OpenBB","Azure PostgreSQL","GCP","Docker"] },
  { t: "Logistic Trip Planner AI Agent", d: "Logistics planner that predicts ETAs from live traffic and weather and answers questions with multimodal RAG.", pts: [
    "XGBoost ETA model: accuracy up 28%; async API calls cut latency by 35%.",
    "LangChain and ChromaDB over text, tables and images; deployed on Cloud Run."
  ], tech: ["FastAPI","XGBoost","LangChain","ChromaDB","Cloud Run","Streamlit"] },
  { t: "Real Estate Agentic RAG System", d: "Agentic system for property research and market insights.", pts: [
    "Column-description embeddings in PGVector behind SQL guardrails: query reliability and schema accuracy up 30%.",
    "Cloud Run with Streamlit, Redis caching and authentication."
  ], tech: ["LangGraph","PostgreSQL","PGVector","Redis","Cloud Run"] }
];
/* ---------- helpers ---------- */
function Reveal({ children, cls = "" }) {
  const r = useRef();
  useEffect(() => {
    const io = new IntersectionObserver(e => e.forEach(x => x.isIntersecting && (x.target.classList.add("in"), io.disconnect())), { threshold: .12 });
    io.observe(r.current); return () => io.disconnect();
  }, []);
  return h("div", { ref: r, className: "rv " + cls }, children);
}
function Typewriter({ words }) {
  const [txt, setTxt] = useState("");
  useEffect(() => {
    let i = 0, j = 0, del = false, t;
    const tick = () => {
      const w = words[i];
      j += del ? -1 : 1; setTxt(w.slice(0, j));
      let d = del ? 40 : 90;
      if (!del && j === w.length) { del = true; d = 1400; }
      else if (del && j === 0) { del = false; i = (i + 1) % words.length; d = 300; }
      t = setTimeout(tick, d);
    };
    tick(); return () => clearTimeout(t);
  }, []);
  return h("div", { className: "role" }, txt, h("span", { className: "cur" }));
}
function Circles() {
  const sizes = [[220, "g"], [340, ""], [500, ""], [680, ""], [880, ""]];
  return h("div", { "aria-hidden": "true" }, sizes.map((c, i) => h("span", { key: i, className: "circ " + c[1], style: { width: c[0], height: c[0], animationDelay: i * .5 + "s" } })));
}
const Chips = ({ items }) => h("div", { className: "chips" }, items.map(x => h("span", { className: "chip", key: x }, x)));
const Sec = (id, title, body) => h("section", { id }, h(Reveal, null, h("h2", null, title)), body);

function App() {
  return h(React.Fragment, null,
    h("nav", null, h("b", null, "RS"), h("div", null, ["about","experience","skills","projects","contact"].map(s => h("a", { href: "#" + s, key: s }, s[0].toUpperCase() + s.slice(1))))),
    h("header", { id: "hero" }, h(Circles), h("div", { className: "hc" },
      h("small", null, "Hello, I’m"),
      h("h1", null, h("span", null, ME.name)),
      h(Typewriter, { words: ME.roles }),
      h("div", { className: "btns" }, h("a", { className: "btn p", href: "#projects" }, "View projects"), h("a", { className: "btn", href: "#contact" }, "Get in touch"))),
      h("div", { className: "scroll" })),
    Sec("about", "About", h(Reveal, null, h("p", { className: "about" }, ME.about),
      h("div", { className: "stats" }, STATS.map(s => h("div", { key: s[1] }, h("b", null, s[0]), h("span", null, s[1])))))),
    Sec("experience", "Experience", EXP.map(e => h(Reveal, { key: e.org }, h("div", { className: "card" },
      h("h3", null, e.role + " · " + e.org), h("div", { className: "meta" }, e.when),
      h("ul", null, e.pts.map(p => h("li", { key: p }, p))))))),
    Sec("skills", "Skills", h("div", { className: "grid sk" }, SKILLS.map(s => h(Reveal, { key: s[0] }, h("div", { className: "card" }, h("h3", null, s[0]), h(Chips, { items: s[1] })))))),
    Sec("projects", "Projects", h("div", { className: "grid" }, PROJECTS.map((p, i) => h(Reveal, { key: p.t }, h("div", { className: "card" },
      h("div", { className: "num" }, "0" + (i + 1)), h("h3", null, p.t), h("p", { style: { color: "var(--mu)", margin: "8px 0" } }, p.d),
      h("ul", null, p.pts.map(x => h("li", { key: x }, x))), h(Chips, { items: p.tech })))))),
    h("section", { id: "contact", className: "contact" }, h(Reveal, null, h("h2", null, "Contact"),
      h("p", null, "Open to Gen AI and agent engineering roles. Let’s talk."),
      h("div", { className: "btns" },
        h("a", { className: "btn p", href: "mailto:" + ME.email }, ME.email),
        h("a", { className: "btn", href: ME.github, target: "_blank", rel: "noopener" }, "GitHub"),
        h("a", { className: "btn", href: "tel:" + ME.phone.replace(/\s/g, "") }, ME.phone)))),
    h("footer", null, "© " + new Date().getFullYear() + " Rajat Sharma · Melbourne, VIC")
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
